<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calculator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='3' width='50' height='58' rx='9' fill='%23202020'/%3E%3Crect x='13' y='9' width='38' height='13' rx='3' fill='%239fd64a'/%3E%3Cg fill='%23404040'%3E%3Crect x='13' y='28' width='8' height='7' rx='2'/%3E%3Crect x='24' y='28' width='8' height='7' rx='2'/%3E%3Crect x='35' y='28' width='8' height='7' rx='2'/%3E%3Crect x='46' y='28' width='5' height='7' rx='2'/%3E%3Crect x='13' y='38' width='8' height='7' rx='2'/%3E%3Crect x='24' y='38' width='8' height='7' rx='2'/%3E%3Crect x='35' y='38' width='8' height='7' rx='2'/%3E%3Crect x='46' y='38' width='5' height='7' rx='2'/%3E%3Crect x='13' y='48' width='8' height='7' rx='2'/%3E%3Crect x='24' y='48' width='8' height='7' rx='2'/%3E%3Crect x='35' y='48' width='8' height='7' rx='2'/%3E%3Crect x='46' y='48' width='5' height='7' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
#calc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.calc{width:100%;max-width:330px;background:#161616;border:1px solid #262626;border-radius:20px;padding:14px;box-shadow:0 12px 48px rgba(0,0,0,.55);user-select:none}
.brand{display:flex;justify-content:space-between;align-items:center;color:#5c5c5c;font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:2px 6px 10px}
.brand .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9fd64a;margin-right:6px;vertical-align:middle}
#displayWrap{background:#0c0c0c;border:1px solid #222;border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:right}
#hist{min-height:16px;color:#6b7f5a;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#display{color:#ecf3e4;font-size:38px;font-weight:300;line-height:1.2;font-variant-numeric:tabular-nums;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:0;border-radius:10px;height:54px;font-size:19px;font-family:inherit;background:#2a2a2a;color:#e8e8e8;cursor:pointer;transition:filter .08s}
.keys button:hover{filter:brightness(1.25)}
.keys button:active{filter:brightness(.8)}
.keys .fn{background:#232323;color:#9fd64a}
.keys .op{background:#9fd64a;color:#161d07;font-weight:700}
.keys .zero{grid-column:span 2}
#launcher{display:none;position:fixed;inset:0}
body.unlocked #calc{display:none}
body.unlocked #launcher{display:block}
#mirrorBox{position:fixed;top:10px;right:10px;z-index:9999;background:rgba(0,0,0,.7);padding:8px;border-radius:6px;color:#fff;display:flex;align-items:center}
select{background:#333;color:#fff;border:1px solid #555;padding:5px;border-radius:4px;font-size:14px;outline:none;cursor:pointer}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#444;font-size:18px;text-align:center;width:90%}
#relock{position:fixed;top:10px;left:10px;z-index:9999;background:rgba(0,0,0,.5);color:#777;border:1px solid #333;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
#relock:hover{color:#aaa}
</style>
</head>
<body>

<div id="calc">
  <div class="calc">
    <div class="brand"><span><span class="dot"></span>Calculator</span><span>Basic</span></div>
    <div id="displayWrap">
      <div id="hist"></div>
      <div id="display">0</div>
    </div>
    <div class="keys">
      <button type="button" class="fn" data-k="AC">AC</button>
      <button type="button" class="fn" data-k="+/-">±</button>
      <button type="button" class="fn" data-k="%">%</button>
      <button type="button" class="op" data-k="/">÷</button>

      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" class="op" data-k="*">×</button>

      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" class="op" data-k="-">−</button>

      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" class="op" data-k="+">+</button>

      <button type="button" class="zero" data-k="0">0</button>
      <button type="button" data-k=".">.</button>
      <button type="button" class="op" data-k="=">=</button>
    </div>
  </div>
</div>

<div id="launcher">
  <div id="mirrorBox">
    <label for="mirrorSelect" style="margin-right:5px;font-size:14px;">Mirror:</label>
    <select id="mirrorSelect">
      <option value="" disabled selected>Select a mirror...</option>
      <option value="https://quantil.jsdelivr.net">quantil.jsdelivr.net (Main)</option>
      <option value="https://cdn.jsdelivr.net">cdn.jsdelivr.net</option>
      <option value="https://fastly.jsdelivr.net">fastly.jsdelivr.net</option>
      <option value="https://testingcf.jsdelivr.net">testingcf.jsdelivr.net</option>
      <option value="https://gcore.jsdelivr.net">gcore.jsdelivr.net</option>
      <option value="https://originfastly.jsdelivr.net">originfastly.jsdelivr.net</option>
      <option value="https://jsd.onmicrosoft.cn">jsd.onmicrosoft.cn</option>
      <option value="https://cdn.staticdelivr.com">cdn.staticdelivr.com</option>
    </select>
  </div>
  <div id="hint">Select a CDN mirror from the top right to launch in a new tab.</div>
  <button type="button" id="relock" title="Back to calculator">&lsaquo; calc</button>
</div>

<script>
(function () {
"use strict";

/* ================= CALCULATOR ================= */
var entry = "0", acc = null, pendingOp = null, freshEntry = false;
var displayEl = document.getElementById("display");
var histEl = document.getElementById("hist");
var OP_SYM = { "+": "+", "-": "\u2212", "*": "\u00d7", "/": "\u00f7" };

function fmt(n) {
  if (typeof n !== "number" || !isFinite(n)) return "Error";
  var r = Math.round(n * 1e10) / 1e10;
  var s = String(r);
  if (s.replace(/[-.]/g, "").length > 12) {
    s = r.toPrecision(9).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
  }
  return s;
}
function compute() {
  var b = parseFloat(entry);
  if (pendingOp === "+") return acc + b;
  if (pendingOp === "-") return acc - b;
  if (pendingOp === "*") return acc * b;
  if (pendingOp === "/") return b === 0 ? NaN : acc / b;
  return b;
}
function render() {
  displayEl.textContent = entry;
  histEl.textContent = (acc !== null && pendingOp !== null) ? fmt(acc) + " " + (OP_SYM[pendingOp] || pendingOp) : "";
}
function resetCalc() { entry = "0"; acc = null; pendingOp = null; freshEntry = false; render(); }
function unlock() { document.body.classList.add("unlocked"); resetCalc(); }

function press(k) {
  if (/^[0-9]$/.test(k)) {
    if (freshEntry) { entry = k; freshEntry = false; }
    else if (entry === "0") entry = k;
    else if (entry === "-0") entry = "-" + k;
    else if (entry.replace(/[-.]/g, "").length < 12) entry += k;
  } else if (k === ".") {
    if (freshEntry) { entry = "0."; freshEntry = false; }
    else if (entry.indexOf(".") < 0) entry += ".";
  } else if (k === "AC") {
    resetCalc(); return;
  } else if (k === "BKSP") {
    if (!freshEntry) { entry = entry.length > 1 ? entry.slice(0, -1) : "0"; if (entry === "-") entry = "0"; }
  } else if (k === "+/-") {
    if (entry !== "0" && entry !== "Error") entry = entry.charAt(0) === "-" ? entry.slice(1) : "-" + entry;
  } else if (k === "%") {
    entry = fmt(parseFloat(entry) / 100); freshEntry = false;
  } else if (k === "=") {
    if (pendingOp === null && entry === "1025") { unlock(); return; }
    if (pendingOp !== null) { entry = fmt(compute()); acc = null; pendingOp = null; }
    freshEntry = true;
  } else {
    if (pendingOp !== null && !freshEntry) {
      entry = fmt(compute());
      acc = isFinite(parseFloat(entry)) ? parseFloat(entry) : null;
    } else if (acc === null) {
      acc = parseFloat(entry);
    }
    pendingOp = k; freshEntry = true;
  }
  render();
}

var keys = document.querySelectorAll("#calc button[data-k]");
for (var i = 0; i < keys.length; i++) {
  (function (b) { b.addEventListener("click", function () { press(b.getAttribute("data-k")); }); })(keys[i]);
}
document.addEventListener("keydown", function (e) {
  if (document.body.classList.contains("unlocked")) return;
  var k = e.key;
  if (/^[0-9]$/.test(k)) press(k);
  else if (k === "." || k === ",") press(".");
  else if (k === "+" || k === "-") press(k);
  else if (k === "*" || k === "x" || k === "X") press("*");
  else if (k === "/") { e.preventDefault(); press("/"); }
  else if (k === "Enter" || k === "=") { e.preventDefault(); press("="); }
  else if (k === "Backspace") { e.preventDefault(); press("BKSP"); }
  else if (k === "Escape" || k === "c" || k === "C") press("AC");
  else if (k === "%") press("%");
});
document.getElementById("relock").addEventListener("click", function () {
  document.body.classList.remove("unlocked");
  resetCalc();
});

/* ================= LAUNCHER + AD CLEANER ================= */
var GAME_PATH = "/gh/s0n-1m-cr1n3/sc13nc3/assets/index.html";

var AD_SRC = "n6wxm|3nbf4|al5sm|surefootedpause|adsterra|popads|popcash|popunder|popmagic|propellerads|monetag|hilltopads|clickadu|mgid|exoclick|exosrv|juicyads|trafficjunky|adcash|zeropark|bidvertiser|revcontent|adskeeper|onclickads|onclickalgo|ad-maven|admaven|trafficstars|tsyndicate|revenuecpm|vidoomy|doubleclick|googlesyndication|adservice|adsystem|adnxs|smartadserver|criteo|outbrain|taboola|pubmatic|rubiconproject|openx|casalemedia|33across|appnexus|adfox|coinzilla|vidverto|media\\.net|profitableratecpm|highperformancecpm|effectivegatecpm|toprevenuegate|revenuegate|cpmgate|performancecpm";

/* The game ships as an XOR-obfuscated document inside a <script type="text/plain">
   payload; a tiny loader decodes it and document.write()s it. The ads hide inside
   that blob, so we decode it ourselves and clean the REAL document instead. */
function tryDecodeXor(payload, key) {
  try {
    var rev = payload.split("").reverse().join("");
    var bin = atob(rev);
    var out = "";
    for (var i = 0; i < bin.length; i++) out += String.fromCharCode(bin.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    var bytes = new Uint8Array(out.length);
    for (var j = 0; j < out.length; j++) bytes[j] = out.charCodeAt(j) & 0xff;
    var text = new TextDecoder("utf-8").decode(bytes);
    return /^\s*<(?:!doctype|html|head|body|script|div|meta|title)/i.test(text) ? text : null;
  } catch (e) { return null; }
}

function unwrapPayload(html) {
  try {
    var holder = html.match(/<script\b[^>]*type\s*=\s*["']text\/plain["'][^>]*>([\s\S]*?)<\/script>/i);
    if (!holder || holder[1].trim().length < 500) return null;
    var scripts = html.match(/<script\b[^>]*>[\s\S]*?<\/script>/gi) || [];
    var loader = null;
    for (var i = 0; i < scripts.length; i++) {
      if (/getElementById\(\s*["'][^"']*payload[^"']*["']\s*\)/i.test(scripts[i]) && /document\.write/i.test(scripts[i])) { loader = scripts[i]; break; }
    }
    if (!loader) return null;
    var keys = [], km, kre = /["']([A-Za-z0-9\-_+=]{6,64})["']/g;
    while ((km = kre.exec(loader))) if (keys.indexOf(km[1]) < 0) keys.push(km[1]);
    for (var k = 0; k < keys.length; k++) {
      var dec = tryDecodeXor(holder[1].trim(), keys[k]);
      if (dec) return dec;
    }
    return null;
  } catch (e) { return null; }
}

function cleanGameHtml(html) {
  if (typeof html !== "string") return html;
  var adRe = new RegExp(AD_SRC, "i");

  /* 1) unpack the obfuscated payload if present — the ads live inside it */
  var unwrapped = unwrapPayload(html);
  if (unwrapped) html = unwrapped;

  /* 2) external <script src=...> / <iframe src=...> hosted on ad networks */
  html = html.replace(new RegExp("<script\\b[^>]*\\bsrc\\s*=\\s*([\"'])[^\"']*(?:" + AD_SRC + ")[^\"']*\\1[^>]*>[\\s\\S]*?<\\/script>", "gi"), "");
  html = html.replace(new RegExp("<script\\b[^>]*\\bsrc\\s*=\\s*([\"'])[^\"']*(?:" + AD_SRC + ")[^\"']*\\1[^>]*>", "gi"), "");
  html = html.replace(new RegExp("<iframe\\b[^>]*\\bsrc\\s*=\\s*([\"'])[^\"']*(?:" + AD_SRC + ")[^\"']*\\1[^>]*>[\\s\\S]*?<\\/iframe>", "gi"), "");
  html = html.replace(new RegExp("<iframe\\b[^>]*\\bsrc\\s*=\\s*([\"'])[^\"']*(?:" + AD_SRC + ")[^\"']*\\1[^>]*>", "gi"), "");

  /* 3) <meta http-equiv=refresh> redirects to ad domains */
  html = html.replace(new RegExp("<meta\\b[^>]*http-equiv\\s*=\\s*([\"']?)refresh\\1[^>]*url\\s*=\\s*https?:[^\"'>\\s]*(?:" + AD_SRC + ")[^\"'>\\s]*[^>]*>", "gi"), "");

  /* 4) inline scripts that behave like ad loaders / popunders / click hijacks.
        Size caps keep the game's own big code bundles untouched. */
  html = html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, function (m, attrs, body) {
    if (/\bsrc\s*=/i.test(attrs)) return m;
    var loaderish = body.length < 600 && /createElement\(\s*["']script["']/.test(body) && /insertBefore|appendChild/.test(body) && /\.src\s*=/.test(body);
    var looksAd = body.length < 600 && (adRe.test(body) || /popunder|popmagic/i.test(body));
    var hijack = body.length < 1500 && /click/i.test(body) && /location\s*\.\s*(href|replace|assign)|window\.open\s*\(/i.test(body) && /https?:\/\//i.test(body);
    var obfuscated = body.length < 3000 && /(atob|unescape)\s*\(/i.test(body) && /window\.open\s*\(|location\s*\.\s*(href|replace|assign)/i.test(body);
    return (loaderish || looksAd || hijack || obfuscated) ? "" : m;
  });

  /* 5) inline event attributes that navigate away / pop up on click */
  html = html.replace(/\s(?:onclick|onmousedown|onmouseup|onpointerdown|ontouchstart)\s*=\s*(["'])(?:(?!\1).)*?(?:window\.open|location\s*\.\s*(?:href|replace|assign))(?:(?!\1).)*?\1/gi, "");

  /* 6) defuse the game's own ad re-injectors and adblock-detection pings: any
        remaining reference to the ad hosts becomes an unresolvable .invalid host
        (string-level, no syntax risk) */
  html = html.replace(/n6wxm\.com|3nbf4\.com|al5sm\.com|surefootedpause\.com|pagead2\.googlesyndication\.com|securepubads\.g\.doubleclick\.net|googleads\.g\.doubleclick\.net|www\.googletagservices\.com/gi, "blocked.invalid");

  return html;
}

function guardHtml() {
  var g = [
    "<scr" + "ipt>/*ngv1*/(function(){",
    "var AD=new RegExp('" + AD_SRC + "','i');",
    /* force the game's own ad kill-switches off (vignette + al5sm tags) */
    "try{localStorage.setItem('vignetteAds','0');}catch(e){}",
    "try{localStorage.setItem('al5smAds','0');}catch(e){}",
    /* surgical popup block: only ad URLs die — the game's own tabs still open */
    "try{var _open=window.open;window.open=function(url,t,f){try{var u=String(url||'');if(u&&AD.test(u))return null;}catch(e){}return _open.apply(window,arguments);};try{Object.defineProperty(window,'open',{value:window.open,writable:false,configurable:false});}catch(e){}}catch(e){}",
    "function fs(el){try{var r=el.getBoundingClientRect();return r.width>=window.innerWidth*0.9&&r.height>=window.innerHeight*0.9;}catch(e){return false;}}",
    "function tp(el){try{var cs=window.getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return false;if(parseFloat(cs.opacity)===0)return true;var bg=cs.backgroundColor||'';if(bg==='transparent')return true;var m=bg.match(/rgba?\\(([^)]+)\\)/);if(m){var p=m[1].split(',');if(p.length===4&&parseFloat(p[3])===0)return true;}return false;}catch(e){return false;}}",
    "function sweep(){try{var i,e,u,els=document.querySelectorAll('script[src],iframe,ins');for(i=0;i<els.length;i++){e=els[i];u=e.getAttribute('src')||e.getAttribute('data-src')||'';if(AD.test(u)){e.remove();}}els=document.querySelectorAll('a,iframe,ins');for(i=0;i<els.length;i++){e=els[i];if(fs(e)&&tp(e)){e.remove();}}}catch(e){}}",
    "try{new MutationObserver(function(){setTimeout(sweep,30);}).observe(document,{childList:true,subtree:true});}catch(e){}",
    "document.addEventListener('click',function(ev){var t=ev.target;if(t&&(t===document.body||t===document.documentElement)){ev.preventDefault();ev.stopPropagation();}},true);",
    "document.addEventListener('DOMContentLoaded',sweep);window.addEventListener('load',sweep);sweep();",
    "window.__adGuardActive=true;",
    "})();<\/scr" + "ipt>"
  ];
  return g.join("");
}

function injectGuard(html) {
  var g = guardHtml();
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + g; });
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, function (m) { return m + g; });
  return g + html;
}

var mirrorSelect = document.getElementById("mirrorSelect");
mirrorSelect.addEventListener("change", async function (e) {
  var mirror = e.target.value;
  if (!mirror) return;
  var win = window.open("about:blank", "_blank");
  try {
    var resp = await fetch(mirror + GAME_PATH + "?t=" + Date.now());
    if (!resp.ok) throw new Error(resp.status);
    var html = await resp.text();
    html = injectGuard(cleanGameHtml(html));
    win.document.open();
    win.document.write(html);
    win.document.close();
  } catch (err) {
    win.document.open();
    win.document.write('<div style="color: black; font-family: sans-serif; padding: 20px;">Failed to load from ' + mirror + '. Try another mirror.</div>');
    win.document.close();
  }
  e.target.value = "";
});

/* test hooks (harmless) */
window.__adTest = { clean: cleanGameHtml, unwrap: unwrapPayload, inject: injectGuard, AD_SRC: AD_SRC };
})();
</script>
</body>
</html>
